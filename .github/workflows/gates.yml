name: gates

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - id: check
        run: |
          npm run typecheck
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  lint:
    needs: types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - id: check
        run: |
          npm run lint
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - id: check
        run: |
          npm test
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - id: check
        run: |
          npm run build
          echo "verdict=pass" >> "$GITHUB_OUTPUT"

  record:
    needs: [types, lint, tests, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p docs/lab3/runs
          echo '{"ts":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","types":"${{ needs.types.outputs.verdict }}","lint":"${{ needs.lint.outputs.verdict }}","tests":"${{ needs.tests.outputs.verdict }}","build":"${{ needs.build.outputs.verdict }}"}' >> docs/lab3/runs/ci-gates.json

